# H2 + JPA
spring.datasource.url=jdbc:h2:mem:apilab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

logging.level.root=INFO

# ============================================================
# SECURITY FIX (Task 7): JWT Configuration - Hardened
# ============================================================

# JWT Secret - Load from environment variable for production
# Set in production: export JWT_SECRET_KEY="your-strong-secret-key-min-32-chars"
# For testing: uses default (change in production!)
jwt.secret=${JWT_SECRET_KEY:default-secure-secret-key-for-testing-please-change}

# JWT Issuer - Identifies who created the token
jwt.issuer=secure-api

# JWT Audience - Identifies who should use the token
jwt.audience=api-users

# JWT Expiration - 15 minutes (900 seconds)
# SECURITY FIX: Short TTL prevents compromised tokens from being valid too long
jwt.expiration=900

# ============================================================
# Rate Limiting Configuration (Task 5)
# ============================================================

resilience4j.ratelimiter.instances.loginLimiter.limit-refresh-period=15m
resilience4j.ratelimiter.instances.loginLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.loginLimiter.timeout-duration=1s
resilience4j.ratelimiter.instances.loginLimiter.register-health-indicator=true

resilience4j.ratelimiter.instances.signupLimiter.limit-refresh-period=1h
resilience4j.ratelimiter.instances.signupLimiter.limit-for-period=10
resilience4j.ratelimiter.instances.signupLimiter.timeout-duration=1s
resilience4j.ratelimiter.instances.signupLimiter.register-health-indicator=true

# ✅ FIX: Added the missing limits for the transfer endpoint (10 per minute)
resilience4j.ratelimiter.instances.transferLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.transferLimiter.limit-for-period=10
resilience4j.ratelimiter.instances.transferLimiter.timeout-duration=1s
resilience4j.ratelimiter.instances.transferLimiter.register-health-indicator=true

resilience4j.ratelimiter.instances.getUserLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.getUserLimiter.limit-for-period=30
resilience4j.ratelimiter.instances.getUserLimiter.timeout-duration=1s
resilience4j.ratelimiter.instances.getUserLimiter.register-health-indicator=true

resilience4j.ratelimiter.instances.getBalanceLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.getBalanceLimiter.limit-for-period=20
resilience4j.ratelimiter.instances.getBalanceLimiter.timeout-duration=1s
resilience4j.ratelimiter.instances.getBalanceLimiter.register-health-indicator=true

resilience4j.ratelimiter.instances.generalLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.generalLimiter.limit-for-period=60
resilience4j.ratelimiter.instances.generalLimiter.timeout-duration=1s
resilience4j.ratelimiter.instances.generalLimiter.register-health-indicator=true

management.endpoints.web.exposure.include=health,metrics,ratelimiters
management.endpoint.health.show-details=when-authorized